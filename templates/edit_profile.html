{% extends "base.html" %}{% block title %}Edit profile · Kolaar{% endblock %}
{% block content %}<div class="eyebrow">Your account</div><h1 class="page-title">Edit profile</h1><div class="card"><form method="POST"><label>Name</label><input name="name" value="{{ user.name }}" required><label>Bio</label><textarea name="bio" placeholder="A little about you...">{{ user.bio or "" }}</textarea><div class="row" style="margin-top:15px"><button>Save changes</button><a class="btn secondary" href="{{ url_for('profile.my_profile') }}">Cancel</a></div></form></div>{% endblock %}
