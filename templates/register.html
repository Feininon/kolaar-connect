{% extends "base.html" %}{% block title %}Create account · Kolaar{% endblock %}
{% block content %}<div class="auth-wrap"><div class="card auth-card">
<a class="brand" href="/">kolaar<span>.</span>connect</a><div class="eyebrow">Join the network</div><h1>Your people are here.</h1><p class="subtle">Create an account to start connecting.</p>
<form method="POST"><label>Full name</label><input name="name" placeholder="Your name" required><label>Username</label><input name="username" placeholder="Choose a username" required><label>Email</label><input name="email" type="email" placeholder="you@example.com" required><label>Password</label><input name="password" type="password" minlength="8" placeholder="At least 8 characters" required><div class="form-actions"><button type="submit">Create account →</button></div></form>
