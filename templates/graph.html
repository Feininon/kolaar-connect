
<!DOCTYPE html>
<html>
<head>
    <title>Social Graph | Kolaar Connect</title>

    <script src="https://unpkg.com/cytoscape@3.30.0/dist/cytoscape.min.js"></script>

    <style>
        #cy {
            width: 100%;
            height: 600px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>Social Network Graph</h1>

    <a href="/feed">Feed</a> |
    <a href="/profile">My Profile</a> |
    <a href="/search">Search</a>

    <div id="cy"></div>

    <script>
        fetch("/api/graph")
            .then(response => response.json())
            .then(data => {
                const cy = cytoscape({
                    container: document.getElementById("cy"),
                    elements: [...data.nodes, ...data.edges],

                    style: [
                        {
                            selector: "node",
                            style: {
                                "label": "data(label)",
                                "background-color": "#2563eb",
                                "color": "#ffffff",
                                "text-valign": "center",
                                "text-halign": "center",
                                "width": 60,
                                "height": 60,
                                "font-size": 12
                            }
                        },
                        {
                            selector: "edge",
                            style: {
                                "width": 2,
                                "line-color": "#94a3b8",
                                "target-arrow-color": "#94a3b8",
                                "target-arrow-shape": "triangle",
                                "curve-style": "bezier",
                                "arrow-scale": 1.2
                            }
                        }
                    ],

                    layout: {
                        name: "cose",
                        animate: true
                    }
                });

                cy.on("tap", "node", function(event) {
                    const username = event.target.data("username");
                    window.location.href = "/profile/" + encodeURIComponent(username);
                });
            });
    </script>
</body>
</html>
